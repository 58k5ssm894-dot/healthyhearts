<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#1a6fad" />
  <title>Clinical Decision Tool</title>
<style>
  :root {
    --accent: #1a6fad;
    --accent-light: rgba(26, 111, 173, 0.1);
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1a2332;
    --muted: #5a6b80;
    --border: #d0d8e4;

    --low: #16a34a;
    --moderate: #b45309;
    --high: #be123c;

    --opt-bg: #fbfcfd;
    --opt-points-bg: #e8edf4;
    --opt-points-selbg: #ffffff;

    --radius: 12px;
    --panel-h: 128px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Dark tokens — OS preference or viewer data-theme="dark". Grok dark family. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: #5b9fd4;
      --accent-light: rgba(91, 159, 212, 0.15);
      --bg: #0f1419;
      --card-bg: #1a2332;
      --text: #e8eef6;
      --muted: #9aabc0;
      --border: #2f3d52;
      --opt-bg: transparent;
      --opt-points-bg: #243044;
      --opt-points-selbg: #0f1419;
    }
  }
  :root[data-theme="dark"] {
    --accent: #5b9fd4;
    --accent-light: rgba(91, 159, 212, 0.15);
    --bg: #0f1419;
    --card-bg: #1a2332;
    --text: #e8eef6;
    --muted: #9aabc0;
    --border: #2f3d52;
    --opt-bg: transparent;
    --opt-points-bg: #243044;
    --opt-points-selbg: #0f1419;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    scroll-padding-bottom: calc(var(--panel-h) + 16px);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 calc(var(--panel-h) + var(--safe-bottom) + 24px);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.45;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: calc(16px + var(--safe-top)) 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  header .subtitle {
    margin: 6px 0 0;
    font-size: 0.85rem;
    opacity: 0.9;
    line-height: 1.4;
    max-width: 36em;
    margin-inline: auto;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .tab-btn {
    min-height: 44px;
    padding: 8px 14px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: var(--card-bg);
    color: var(--text);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn:active { background: var(--accent-light); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .reset-btn {
    margin-left: auto;
    min-height: 44px;
    padding: 8px 14px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:hover,
  .reset-btn:active { color: var(--text); border-color: var(--muted); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  .q-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04);
    animation: rise 0.18s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .q-card, .result-card { animation: none; }
    * { scroll-behavior: auto !important; }
  }
  .q-card__num {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .q-card__prompt { margin: 0 0 4px; font-size: 1.05rem; font-weight: 650; line-height: 1.35; letter-spacing: -0.01em; }
  .q-card__help { margin: 4px 0 12px; font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
  .q-card__options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

  .opt-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--opt-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 550;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .opt-btn:hover { border-color: var(--accent); }
  .opt-btn:active { background: var(--accent-light); }
  .opt-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt-btn--selected {
    border-color: var(--accent);
    background: var(--accent-light);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .opt-btn__label { flex: 1; min-width: 0; }
  .opt-btn__points {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--opt-points-bg);
    padding: 2px 8px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .opt-btn--selected .opt-btn__points { color: var(--accent); background: var(--opt-points-selbg); }

  .result-card {
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: var(--radius);
    background: var(--card-bg);
    padding: 16px;
    animation: rise 0.18s ease;
  }
  .result-card--low      { border-left-color: var(--low); }
  .result-card--moderate { border-left-color: var(--moderate); }
  .result-card--high     { border-left-color: var(--high); }
  .result-card__kicker {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-card__title { margin: 4px 0 6px; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .result-card__detail { margin: 0; font-size: 0.9rem; line-height: 1.5; color: var(--text); }
  .result-card__sections { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .result-section__heading {
    margin: 0 0 4px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .result-section__list {
    margin: 0;
    padding-left: 1.15em;
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .result-section__list li { margin: 0.2em 0; }
  .result-section__body {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
  }

  .result-panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--card-bg) 94%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 16px rgba(15, 20, 25, 0.08);
    padding: 12px 16px calc(12px + var(--safe-bottom));
  }
  .result-panel__inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .result-score {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 72px;
    min-height: 60px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
  }
  .result-score__label { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .result-score__value { font-size: 1.7rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

  .result-status { flex: 1; min-width: 0; }
  .result-status__title {
    font-size: 0.98rem;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .result-status__detail {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
  .result-source {
    max-width: 640px;
    margin: 6px auto 0;
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.35;
  }

  .result-panel--done.result-panel--low      .result-score { background: var(--low); }
  .result-panel--done.result-panel--moderate  .result-score { background: var(--moderate); }
  .result-panel--done.result-panel--high      .result-score { background: var(--high); }
  .result-panel--hide-score .result-score { display: none; }
  .result-panel--hide-score .result-status__title { font-size: 1.02rem; }

  /* iPhone / narrow screens */
  @media (max-width: 480px) {
    header h1 { font-size: 1.2rem; }
    header .subtitle { font-size: 0.8rem; }
    .controls { padding: 8px 12px; gap: 8px; }
    .tabs { width: 100%; }
    .reset-btn {
      margin-left: 0;
      width: 100%;
    }
    main { padding: 12px; gap: 12px; }
    .q-card { padding: 14px 14px 12px; }
    .q-card__prompt { font-size: 1.02rem; }
    .result-panel { padding: 10px 12px calc(10px + var(--safe-bottom)); }
    .result-panel__inner { gap: 10px; }
    .result-score { width: 64px; min-height: 54px; }
    .result-score__value { font-size: 1.45rem; }
    .result-status__detail { -webkit-line-clamp: 4; }
  }
</style>
</head>
<body>

<header>
  <h1 id="tool-title">Clinical Decision Tool</h1>
  <p class="subtitle" id="tool-subtitle"></p>
</header>

<div class="controls">
  <div class="tabs" id="tabs" aria-label="Available tools"></div>
  <button class="reset-btn" id="reset-btn" type="button" hidden>Start over</button>
</div>

<main id="app" aria-live="polite"></main>

<aside class="result-panel" id="result-panel" aria-live="polite">
  <div class="result-panel__inner">
    <div class="result-score">
      <span class="result-score__label">Score</span>
      <span class="result-score__value" id="score-value">0</span>
    </div>
    <div class="result-status" id="result-status">
      <div class="result-status__title" id="result-title">In progress…</div>
      <div class="result-status__detail" id="result-detail">Answer the questions above.</div>
    </div>
  </div>
  <p class="result-source" id="result-source" hidden></p>
</aside>

<script>
/* ── Content data (mirrors decision/data/tools.js) ─────────────────────────── */
window.DECISION_TOOLS = [
{
    id: "ambulatory-echo-steward",
    name: "Ambulatory Echo Stewardship",
    source: "Simplified from 2011 Echo AUC; 2019 multimodality AUC; 2021 AHA/ACC Chest Pain Guideline; 2023 CCD AUC.",
    hideScore: true,
    start: "q_safety",
    nodes: {
      q_safety: {
        type: "question",
        prompt: "Emergency or higher-acuity features?",
        options: [
          { label: "Yes — send to ED / higher acuity", next: "r_ed" },
          { label: "No — outpatient evaluation", next: "q_complaint" }
        ]
      },
      q_complaint: {
        type: "question",
        prompt: "Primary presentation?",
        options: [
          { label: "Chest pain / anginal equivalent", next: "q_cp_structure" },
          { label: "Dyspnea", next: "q_dyspnea" },
          { label: "Palpitations / ectopy", next: "q_palp" },
          { label: "Lightheadedness / syncope", next: "q_sync" },
          { label: "Edema / suspected HF", next: "r_tte" },
          { label: "Murmur", next: "q_murmur" },
          { label: "Abnormal ECG", next: "q_ecg" },
          { label: "Screening / preop / clearance", next: "q_screen" },
          { label: "Suspected PE", next: "r_pe" },
          { label: "Other / not sure", next: "r_uncertain" }
        ]
      },
      q_cp_structure: {
        type: "question",
        prompt: "Independent structure/function indication?",
        options: [
          { label: "Yes", next: "r_tte_plus_ischemia" },
          { label: "No — ischemia / CAD question", next: "q_cp_known_cad" }
        ]
      },
      q_cp_known_cad: {
        type: "question",
        prompt: "Known CAD?",
        options: [
          { label: "Yes", next: "r_func_known_cad" },
          { label: "No", next: "q_cp_risk" }
        ]
      },
      q_cp_risk: {
        type: "question",
        prompt: "Clinical risk?",
        options: [
          { label: "Low-risk stable", next: "q_cp_exercise_low" },
          { label: "Intermediate or higher, stable", next: "q_cp_exercise_int" },
          { label: "Recent acute, now stable for outpatient testing", next: "q_cp_exercise_int" },
          { label: "High-risk / possible ongoing ACS", next: "r_ed" }
        ]
      },
      q_cp_exercise_low: {
        type: "question",
        prompt: "Can exercise with interpretable ECG?",
        options: [
          { label: "Yes", next: "r_tm_low" },
          { label: "No", next: "r_pharma_or_ccta" }
        ]
      },
      q_cp_exercise_int: {
        type: "question",
        prompt: "Can exercise with interpretable ECG?",
        options: [
          { label: "Yes", next: "r_stress_or_ccta" },
          { label: "No", next: "r_pharma_or_ccta" }
        ]
      },
      q_dyspnea: {
        type: "question",
        prompt: "Dyspnea best fits?",
        options: [
          { label: "Suspected HF / structural concern", next: "r_tte" },
          { label: "Primarily PE concern", next: "r_pe" },
          { label: "Exertional ischemic equivalent", next: "q_cp_known_cad" },
          { label: "Low cardiac suspicion", next: "r_none_low" }
        ]
      },
      q_palp: {
        type: "question",
        prompt: "Palpitations / ectopy?",
        options: [
          { label: "Sustained tachycardia, syncope, abnormal ECG, or known heart disease", next: "r_tte" },
          { label: "Infrequent ectopy; otherwise low risk", next: "r_none" }
        ]
      },
      q_sync: {
        type: "question",
        prompt: "Lightheadedness / syncope?",
        options: [
          { label: "True/exertional syncope, abnormal ECG, or other CV signs", next: "r_tte" },
          { label: "Isolated presyncope; no other CV features", next: "r_none" }
        ]
      },
      q_murmur: {
        type: "question",
        prompt: "Murmur?",
        options: [
          { label: "New, changed, or suspicious", next: "r_tte" },
          { label: "Soft / innocent-appearing", next: "r_none" }
        ]
      },
      q_ecg: {
        type: "question",
        prompt: "Abnormal ECG context?",
        options: [
          { label: "Suggests structural disease", next: "r_tte" },
          { label: "Mainly for ischemia workup", next: "q_cp_known_cad" },
          { label: "Isolated low-yield finding (e.g. asymptomatic sinus bradycardia)", next: "r_none" }
        ]
      },
      q_screen: {
        type: "question",
        prompt: "Screening / clearance / preop?",
        options: [
          { label: "Asymptomatic screening or routine preop — no CV symptoms", next: "r_none" },
          { label: "Sports clearance — asymptomatic, normal exam, no family history", next: "r_none" },
          { label: "Symptoms, abnormal exam/ECG, or positive family history", next: "q_screen_pos" },
          { label: "Stable known disease or prior normal study — no change", next: "r_none" }
        ]
      },
      q_screen_pos: {
        type: "question",
        prompt: "Dominant question?",
        options: [
          { label: "Structure / function", next: "r_tte" },
          { label: "Ischemia / CAD", next: "q_cp_known_cad" },
          { label: "Both", next: "r_tte_plus_ischemia" }
        ]
      },

      r_ed: {
        type: "result",
        title: "Not an outpatient imaging decision",
        severity: "high",
        next: "ED / higher-acuity pathway",
        avoid: "Delaying acute care for outpatient resting TTE"
      },
      r_tte: {
        type: "result",
        title: "Order resting TTE",
        severity: "low",
        next: "Resting TTE"
      },
      r_tte_plus_ischemia: {
        type: "result",
        title: "Order resting TTE + separate ischemia test",
        severity: "low",
        next: "Resting TTE for structure; exercise ECG / stress imaging / CCTA for ischemia",
        avoid: "Resting TTE alone for provocable ischemia"
      },
      r_tm_low: {
        type: "result",
        title: "Prefer exercise ECG",
        severity: "moderate",
        next: "Outpatient exercise ECG",
        avoid: "Resting TTE solely for ischemia"
      },
      r_stress_or_ccta: {
        type: "result",
        title: "Prefer CCTA or stress imaging",
        severity: "moderate",
        next: "CCTA or stress imaging (local expertise/availability)",
        avoid: "Resting TTE as the ischemia test"
      },
      r_pharma_or_ccta: {
        type: "result",
        title: "Prefer pharmacologic stress or CCTA",
        severity: "moderate",
        next: "Pharmacologic stress imaging or CCTA",
        avoid: "Exercise ECG if cannot exercise or ECG uninterpretable; resting TTE for CAD"
      },
      r_func_known_cad: {
        type: "result",
        title: "Prefer functional testing for ischemia",
        severity: "moderate",
        next: "Stress imaging (or selected exercise ECG); add resting TTE only if separate structural indication",
        avoid: "Resting TTE alone to decide if symptoms are ischemic"
      },
      r_none: {
        type: "result",
        title: "Do not order resting TTE",
        severity: "high",
        next: "No cardiac imaging for this indication",
        avoid: "Low-yield screening or routine recheck without clinical change"
      },
      r_none_low: {
        type: "result",
        title: "Do not order resting TTE first",
        severity: "moderate",
        next: "Evaluate noncardiac causes; reassess if cardiac features emerge",
        avoid: "Default echo for mild dyspnea without cardiac features"
      },
      r_pe: {
        type: "result",
        title: "Use PE pathway — not resting TTE",
        severity: "high",
        next: "Institutional PE pathway (e.g. D-dimer, CTPA)",
        avoid: "Resting TTE to rule in/out PE"
      },
      r_uncertain: {
        type: "result",
        title: "Clarify the clinical question",
        severity: "moderate",
        next: "Structure → TTE; ischemia → stress/CCTA; neither → no imaging",
        avoid: "Default resting TTE when the question is undefined"
      }
    }
  },
{
    id: "resting-tte-steward",
    name: "Echo Stewardship (AUC v1)",
    source: "Simplified from 2011 Echo AUC; 2019 multimodality AUC; 2021 AHA/ACC Chest Pain Guideline; 2023 CCD AUC.",
    hideScore: true,
    start: "q_primary",
    nodes: {
      q_primary: {
        type: "question",
        prompt: "Primary clinical question?",
        options: [
          { label: "Structure / function / HF / valve", next: "q_struct" },
          { label: "Ischemia / CAD", next: "q_isch_known" },
          { label: "Both structure and ischemia", next: "q_both" },
          { label: "Screening / preop / clearance / low-yield", next: "q_steward" },
          { label: "Suspected PE only", next: "r_pe_pathway" },
          { label: "Not sure", next: "r_uncertain" }
        ]
      },
      q_struct: {
        type: "question",
        prompt: "Structure/function indication?",
        options: [
          { label: "Suspected HF / cardiomyopathy", next: "r_tte_hf" },
          { label: "Structural symptoms/signs", next: "r_tte_structure" },
          { label: "Abnormal ECG/CXR/biomarkers for structure", next: "r_tte_abn_test" },
          { label: "Known disease with change, or management needs echo", next: "r_tte_change" },
          { label: "Stable mild disease — routine recheck, no change", next: "r_none_surveillance" },
          { label: "Prior normal TTE — no clinical change", next: "r_none_surveillance" }
        ]
      },
      q_both: {
        type: "question",
        prompt: "Independent structure/function indication?",
        options: [
          { label: "Yes", next: "r_tte_plus_ischemia" },
          { label: "No — mainly ischemia", next: "q_isch_known" },
          { label: "Unclear", next: "r_uncertain" }
        ]
      },
      q_isch_known: {
        type: "question",
        prompt: "Known CAD?",
        options: [
          { label: "Yes", next: "q_isch_struct_extra_known" },
          { label: "No", next: "q_isch_risk" }
        ]
      },
      q_isch_struct_extra_known: {
        type: "question",
        prompt: "Also a structure/function question?",
        options: [
          { label: "Yes", next: "r_tte_plus_func" },
          { label: "No — ischemia only", next: "r_func_known_cad" }
        ]
      },
      q_isch_risk: {
        type: "question",
        prompt: "Clinical setting?",
        options: [

      r_tte_hf: {

      },

      },
      r_none_murmur: {

      },
      r_pe_pathway: {

      },
      r_uncertain: {

        title: "Clarify the clinical question",

        avoid: "Default resting TTE when the question is undefined"
      }
    }
  }

<script>
/* ── Engine (mirrors decision/app.js) ──────────────────────────────────────── */
(function () {
  "use strict";

  var tools = window.DECISION_TOOLS || [];
  var state = { tool: null, path: [] };

  var els = {
    title:       document.getElementById("tool-title"),
    subtitle:    document.getElementById("tool-subtitle"),
    tabs:        document.getElementById("tabs"),
    resetBtn:    document.getElementById("reset-btn"),
    app:         document.getElementById("app"),
    panel:       document.getElementById("result-panel"),
    scoreBox:    document.querySelector(".result-score"),
    scoreValue:  document.getElementById("score-value"),
    resultTitle: document.getElementById("result-title"),
    resultDetail:document.getElementById("result-detail"),
    resultSource:document.getElementById("result-source")
  };

  function computeFlow() {
    var tool = state.tool;
    var steps = [];
    var score = 0;
    var terminal = null;
    var nodeId = tool.start;
    var pathIndex = 0;

    while (nodeId) {
      var node = tool.nodes[nodeId];
      if (!node) break;
      if (node.type === "result") { terminal = resultFromNode(node); break; }

      var sel = state.path[pathIndex];
      var selectedIndex = sel && sel.nodeId === nodeId ? sel.optionIndex : -1;
      steps.push({ nodeId: nodeId, node: node, selectedIndex: selectedIndex });
      if (selectedIndex < 0) { nodeId = null; break; }

      var opt = node.options[selectedIndex];
      score += Number(opt.points) || 0;
      pathIndex++;

      if (!opt.next) { terminal = resultFromBands(tool, score); nodeId = null; }
      else { nodeId = opt.next; }
    }
    return { steps: steps, score: score, terminal: terminal };
  }

  function resultFromNode(node) {
    return {
      kind: "result",
      title: node.title || "Result",
      severity: node.severity || null,
      next: node.next || null,
      avoid: node.avoid || null
    };
  }
  function resultFromBands(tool, score) {
    var bands = tool.resultBands || [];
    for (var i = 0; i < bands.length; i++) {
      var b = bands[i];
      if (score >= b.min && score <= b.max) {
        return { kind: "band", title: b.title || "Result", detail: b.detail || "", severity: b.severity || null };
      }
    }
    return { kind: "band", title: "Score: " + score, detail: "No result band is defined for this score.", severity: null };
  }

  function render() {
    var flow = computeFlow();
    renderQuestions(flow.steps, flow.terminal);
    renderPanel(flow);
    els.resetBtn.hidden = state.path.length === 0;
  }

  function renderQuestions(steps, terminal) {
    els.app.innerHTML = "";
    steps.forEach(function (step, i) { els.app.appendChild(buildQuestionCard(step, i)); });
    if (terminal) els.app.appendChild(buildTerminalCard(terminal));
  }

  function buildQuestionCard(step, index) {
    var card = document.createElement("section");
    card.className = "q-card";
    card.setAttribute("data-node", step.nodeId);

    var num = document.createElement("div");
    num.className = "q-card__num";
    num.textContent = "Q" + (index + 1);
    card.appendChild(num);

    var prompt = document.createElement("h2");
    prompt.className = "q-card__prompt";
    prompt.textContent = step.node.prompt;
    card.appendChild(prompt);

    if (step.node.help) {
      var help = document.createElement("p");
      help.className = "q-card__help";
      help.textContent = step.node.help;
      card.appendChild(help);
    }

    var opts = document.createElement("div");
    opts.className = "q-card__options";
    step.node.options.forEach(function (opt, oi) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-btn" + (oi === step.selectedIndex ? " opt-btn--selected" : "");
      btn.setAttribute("aria-pressed", oi === step.selectedIndex ? "true" : "false");

      var label = document.createElement("span");
      label.className = "opt-btn__label";
      label.textContent = opt.label;
      btn.appendChild(label);

      var pts = Number(opt.points) || 0;
      if (pts !== 0) {
        var badge = document.createElement("span");
        badge.className = "opt-btn__points";
        badge.textContent = (pts > 0 ? "+" : "") + pts;
        btn.appendChild(badge);
      }
      btn.addEventListener("click", function () { selectOption(index, step.nodeId, oi); });
      opts.appendChild(btn);
    });
    card.appendChild(opts);
    return card;
  }

  function appendSection(parent, heading, itemsOrText) {
    if (!itemsOrText || (Array.isArray(itemsOrText) && !itemsOrText.length)) return;
    var sec = document.createElement("div");
    sec.className = "result-section";
    var h = document.createElement("h3");
    h.className = "result-section__heading";
    h.textContent = heading;
    sec.appendChild(h);
    if (Array.isArray(itemsOrText)) {
      var ul = document.createElement("ul");
      ul.className = "result-section__list";
      itemsOrText.forEach(function (item) {
        var li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    } else {
      var p = document.createElement("p");
      p.className = "result-section__body";
      p.textContent = itemsOrText;
      sec.appendChild(p);
    }
    parent.appendChild(sec);
  }

  function buildTerminalCard(terminal) {
    var card = document.createElement("section");
    card.className = "result-card" + (terminal.severity ? " result-card--" + terminal.severity : "");
    var kicker = document.createElement("div");
    kicker.className = "result-card__kicker";
    kicker.textContent = "Recommendation";
    card.appendChild(kicker);
    var title = document.createElement("h2");
    title.className = "result-card__title";
    title.textContent = terminal.title;
    card.appendChild(title);
    if (terminal.next || terminal.avoid) {
      var wrap = document.createElement("div");
      wrap.className = "result-card__sections";
      appendSection(wrap, "Next", terminal.next);
      appendSection(wrap, "Avoid", terminal.avoid);
      card.appendChild(wrap);
    }
    return card;
  }

  function selectOption(index, nodeId, optionIndex) {
    state.path = state.path.slice(0, index);
    state.path.push({ nodeId: nodeId, optionIndex: optionIndex });
    render();
    requestAnimationFrame(function () {
      var cards = els.app.children;
      var target = cards[index + 1];
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  }

  function renderPanel(flow) {
    var hideScore = !!(state.tool && state.tool.hideScore);
    els.panel.classList.toggle("result-panel--hide-score", hideScore);
    if (els.scoreBox) els.scoreBox.setAttribute("aria-hidden", hideScore ? "true" : "false");
    els.scoreValue.textContent = String(flow.score);
    els.panel.classList.remove("result-panel--low", "result-panel--moderate", "result-panel--high", "result-panel--done");
    if (flow.terminal) {
      els.panel.classList.add("result-panel--done");
      if (flow.terminal.severity) els.panel.classList.add("result-panel--" + flow.terminal.severity);
      els.resultTitle.textContent = flow.terminal.title;
      els.resultDetail.textContent = flow.terminal.next || "";
    } else {
      els.resultTitle.textContent = "In progress…";
      els.resultDetail.textContent = state.path.length ? "Answer the next question." : "Answer the questions above.";
    }
  }

  function selectTool(tool) {
    state.tool = tool;
    state.path = [];
    els.title.textContent = tool.name || "Clinical Decision Tool";
    if (els.subtitle) {
      els.subtitle.textContent = "";
      els.subtitle.hidden = true;
    }
    if (tool.source) { els.resultSource.textContent = "Source: " + tool.source; els.resultSource.hidden = false; }
    else els.resultSource.hidden = true;
    els.panel.classList.toggle("result-panel--hide-score", !!tool.hideScore);
    Array.prototype.forEach.call(els.tabs.children, function (btn) {
      var active = btn.getAttribute("data-tool-id") === tool.id;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
    render();
  }

  function buildTabs() {
    els.tabs.innerHTML = "";
    if (tools.length <= 1) { els.tabs.hidden = true; return; }
    els.tabs.hidden = false;
    tools.forEach(function (tool) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn";
      btn.setAttribute("data-tool-id", tool.id);
      btn.textContent = tool.name;
      btn.addEventListener("click", function () { selectTool(tool); });
      els.tabs.appendChild(btn);
    });
  }

  function init() {
    if (!tools.length) {
      els.app.innerHTML = '<p class="empty">No decision tools are configured.</p>';
      els.panel.hidden = true;
      return;
    }
    buildTabs();
    els.resetBtn.addEventListener("click", function () {
      if (state.tool) { state.path = []; render(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    selectTool(tools[0]);
  }

  init();
})();
</script>
</body>
